<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Stand-ins for the SF Symbols in design/README.md ("Iconography"), which can't ship
       outside Apple platforms. Outlined, round joins, drawn on a 24 grid; colour comes from
       currentColor (ink or ink-muted). Filled variants only for transport (play, pause).
       Symbols outside the design table (gauge, chart, cpu, trash, clock, drive) follow the
       same rules. Use: <svg class="icon"><use href="/admin/assets/icons.svg#film"/></svg> -->

  <!-- server.rack -->
  <symbol id="server" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4" width="17" height="6.5" rx="1.75"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1.75"/>
    <path d="M7 7.25h.01M7 16.75h.01M11 7.25h6M11 16.75h6"/></g></symbol>

  <!-- rectangle.stack (Library) -->
  <symbol id="stack" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="9" width="17" height="11" rx="2"/><path d="M6 6h12M8.5 3.25h7"/></g></symbol>

  <!-- gauge (Overview) -->
  <symbol id="gauge" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.2 17.5a8.75 8.75 0 1 1 15.6 0"/><path d="M12 13.5l4-4.5"/><circle cx="12" cy="14" r="1.25"/></g></symbol>

  <!-- film -->
  <symbol id="film" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M7.5 4v16M16.5 4v16M3.5 8.5h4M3.5 12h4M3.5 15.5h4M16.5 8.5h4M16.5 12h4M16.5 15.5h4"/></g></symbol>

  <!-- folder -->
  <symbol id="folder" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 7.5V17a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2V9.5a2 2 0 0 0-2-2h-6.2l-2-2.5H5.5a2 2 0 0 0-2 2z"/></g></symbol>

  <!-- magnifyingglass -->
  <symbol id="search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></symbol>

  <!-- arrow.counterclockwise -->
  <symbol id="replay" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.2 9.5A7.5 7.5 0 1 1 4.5 13"/><path d="M4.5 4.75V9.5h4.75"/></g></symbol>

  <!-- play.fill / pause.fill -->
  <symbol id="play" viewBox="0 0 24 24"><path fill="currentColor" d="M7.5 4.6v14.8c0 .8.9 1.3 1.6.9l11.6-7.4c.6-.4.6-1.4 0-1.8L9.1 3.7c-.7-.4-1.6.1-1.6.9z"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><g fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.25"/><rect x="14" y="4.5" width="4" height="15" rx="1.25"/></g></symbol>

  <!-- xmark / checkmark -->
  <symbol id="close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g></symbol>
  <symbol id="check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></g></symbol>

  <!-- exclamationmark.triangle / info.circle -->
  <symbol id="alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.3 4.3L2.9 17.5A2 2 0 0 0 4.6 20.5h14.8a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5M12 17.25h.01"/></g></symbol>
  <symbol id="info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.75h.01"/></g></symbol>

  <!-- chevron.right -->
  <symbol id="chevron" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></g></symbol>

  <!-- Dashboard extras, same style -->
  <symbol id="trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 6.5h15M9.5 6.5V4.75c0-.7.6-1.25 1.25-1.25h2.5c.7 0 1.25.55 1.25 1.25V6.5M6.5 6.5l.8 12.2a2 2 0 0 0 2 1.8h5.4a2 2 0 0 0 2-1.8l.8-12.2M10.25 10.5v6M13.75 10.5v6"/></g></symbol>
  <symbol id="clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
  <symbol id="drive" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="13" width="17" height="6.5" rx="1.75"/><path d="M5.2 13L7.5 5.6a2 2 0 0 1 1.9-1.4h5.2a2 2 0 0 1 1.9 1.4L18.8 13M16.5 16.25h.01"/></g></symbol>
  <symbol id="chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6.5 20v-6M11 20V8M15.5 20v-9M20 20V5"/></g></symbol>
  <symbol id="cpu" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx=".75"/>
    <path d="M9.5 3v3M14.5 3v3M9.5 18v3M14.5 18v3M3 9.5h3M3 14.5h3M18 9.5h3M18 14.5h3"/></g></symbol>
  <symbol id="key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8L19.5 3.5M16.5 6.5l2.5 2.5M14.5 8.5l2 2"/></g></symbol>
</svg>
