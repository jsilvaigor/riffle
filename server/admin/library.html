<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Library · Riffle Server admin</title>
<meta name="theme-color" content="#111113">
<link rel="icon" href="/admin/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/admin/assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/admin/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/admin/assets/admin.css">
<script src="/admin/assets/htmx.min.js"></script>
<script src="/admin/assets/admin.js" defer></script>
<script src="/admin/assets/library.js" defer></script>
</head>
<body>
<header>
  <h1><a class="brand" href="/admin/"><img src="/admin/assets/riffle-lockup.svg" alt="Riffle" width="98" height="30"><span>Server admin</span></a></h1>
  <nav><a href="/admin/"><svg class="icon" aria-hidden="true"><use href="/admin/assets/icons.svg#gauge"/></svg> Overview</a><a href="/admin/library" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/admin/assets/icons.svg#stack"/></svg> Library</a></nav>
  <button id="token-btn" class="link" type="button" aria-label="Change token"><svg class="icon" aria-hidden="true"><use href="/admin/assets/icons.svg#key"/></svg><span class="label">Change token</span></button>
</header>

<section id="offline" class="empty" hidden>
  <img src="/admin/assets/offline.svg" alt="" width="160" height="107">
  <h3>Can't reach Riffle Server</h3>
  <p>Check that the container is running, then try again.</p>
  <button type="button" onclick="location.reload()"><svg class="icon" aria-hidden="true"><use href="/admin/assets/icons.svg#replay"/></svg> Try again</button>
</section>

<section id="login" hidden>
  <form id="login-form">
    <div class="empty" style="padding:8px 0 16px">
      <img src="/admin/assets/empty-server.svg" alt="" width="160" height="107">
      <h3>Connect to Riffle Server</h3>
    </div>
    <p class="muted" id="login-msg">Paste the server's <code>RIFFLE_TOKEN</code>. It's kept in this browser only.</p>
    <input id="token-input" type="password" autocomplete="current-password" spellcheck="false" required
           aria-label="Riffle Server token">
    <button class="primary" type="submit">Connect</button>
  </form>
</section>

<main id="panels" class="explorer">
  <aside class="tree-pane">
    <div id="tree" hx-get="/admin/f/tree" hx-trigger="refresh from:body once">
      <p class="placeholder">Loading…</p>
    </div>
  </aside>

  <section class="browser">
    <!-- library.js sets the folder and fires "browse" (on load and when a folder is picked). -->
    <form id="filters" class="filters" role="search"
          hx-get="/admin/f/browse" hx-target="#results" hx-sync="this:replace"
          hx-trigger="browse, change, input delay:300ms">
      <input type="hidden" name="folder" id="folder-input">
      <label class="search"><svg class="icon" aria-hidden="true"><use href="/admin/assets/icons.svg#search"/></svg><input type="search" name="q" placeholder="Search this folder"
        aria-label="Search this folder and its subfolders" autocomplete="off"></label>
      <select name="state" aria-label="Show">
        <option value="">All videos</option>
        <option value="ready">Thumbnails ready</option>
        <option value="pending">Thumbnails pending</option>
        <option value="failed">Thumbnails failed</option>
        <option value="probe-error">Unreadable metadata</option>
        <option value="portrait">Portrait</option>
        <option value="watched">Started watching</option>
      </select>
      <select name="sort" aria-label="Sort by">
        <option value="">Name</option>
        <option value="recent">Recently changed</option>
        <option value="size">Largest</option>
        <option value="duration">Longest</option>
      </select>
    </form>
    <div id="results"></div>
  </section>
</main>

<dialog id="item" aria-label="Video details"></dialog>
<div id="toast" aria-live="polite"></div>
</body>
</html>
